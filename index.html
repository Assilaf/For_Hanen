<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a1426" media="(prefers-color-scheme: dark)">
<title>اعتذار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg1: #ffe3ea; --bg2: #ffeadb; --bg3: #e9e0ff;
  --card: rgba(255, 255, 255, .72);
  --card-line: rgba(255, 255, 255, .9);
  --ink: #4a2038;
  --ink-soft: #7d4d66;
  --a1: #ec5b86; --a2: #d4386a;
  --ghost: #b2305c; --ghost-line: rgba(212, 56, 106, .45);
  --glow: rgba(212, 56, 106, .55);
  --shadow: 0 24px 60px -24px rgba(180, 50, 100, .45), 0 2px 8px rgba(180, 50, 100, .08);
  --heart: #f58aa8;
  --scrim: rgba(74, 32, 56, .32);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #2a1426; --bg2: #3a1a2e; --bg3: #24173d;
    --card: rgba(62, 30, 54, .72);
    --card-line: rgba(255, 255, 255, .12);
    --ink: #ffe8f0; --ink-soft: #e8b6ca;
    --ghost: #ff9fbd; --ghost-line: rgba(255, 159, 189, .5);
    --heart: #ff7aa2;
    --scrim: rgba(10, 4, 10, .55);
    --shadow: 0 24px 60px -24px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #2a1426; --bg2: #3a1a2e; --bg3: #24173d;
  --card: rgba(62, 30, 54, .72);
  --card-line: rgba(255, 255, 255, .12);
  --ink: #ffe8f0; --ink-soft: #e8b6ca;
  --ghost: #ff9fbd; --ghost-line: rgba(255, 159, 189, .5);
  --heart: #ff7aa2;
  --scrim: rgba(10, 4, 10, .55);
  --shadow: 0 24px 60px -24px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; background: var(--bg1); }
body {
  margin: 0; height: 100%; overflow: hidden;
  color: var(--ink);
  font-family: "Tajawal", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  background-color: var(--bg1);
  background-image:
    radial-gradient(60% 45% at 12% 8%, var(--bg3), transparent 70%),
    radial-gradient(70% 50% at 92% 94%, var(--bg2), transparent 70%),
    linear-gradient(165deg, var(--bg1), var(--bg2));
  background-repeat: no-repeat;
  -webkit-font-smoothing: antialiased;
}

/* floating hearts */
#hearts { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.heart {
  position: absolute; left: var(--x); bottom: -48px;
  font-size: var(--s); color: var(--heart); opacity: 0;
  animation: rise var(--d) ease-in forwards;
}
@keyframes rise {
  0% { transform: translateY(0) rotate(0); opacity: 0; }
  12% { opacity: .65; }
  100% { transform: translateY(-125vh) rotate(var(--r)); opacity: 0; }
}

/* screens */
.stage { position: relative; z-index: 1; height: 100%; }
.screen {
  position: absolute; inset: 0; display: flex; overflow-y: auto;
  padding: 20px;
  opacity: 0; visibility: hidden; pointer-events: none;
  transform: translateY(28px) scale(.97);
  transition: opacity .6s ease, transform .6s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .6s;
}
.screen.active {
  opacity: 1; visibility: visible; pointer-events: auto; transform: none;
  transition-delay: .12s, .12s, 0s;
}
.screen.out { transform: translateY(-26px) scale(.97); }

.card {
  margin: auto; width: 100%; max-width: 380px;
  padding: 36px 24px 28px;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--card-line);
  border-radius: 32px;
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  backdrop-filter: blur(18px) saturate(1.3);
}
.icon { width: 56px; height: 56px; animation: beat 1.8s ease-in-out infinite; }
@keyframes beat {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.14); }
  28% { transform: scale(1); }
  42% { transform: scale(1.1); }
  70% { transform: scale(1); }
}
.q {
  margin: 0;
  font-family: "Amiri", "Noto Naskh Arabic", "Geeza Pro", serif;
  font-weight: 700;
  font-size: clamp(1.9rem, 8.2vw, 2.6rem);
  line-height: 1.55;
}
.actions { width: 100%; display: grid; gap: 12px; }
.actions.two { grid-template-columns: 1fr 1fr; }

.btn {
  appearance: none; -webkit-appearance: none; border: 0; cursor: pointer;
  width: 100%; min-height: 56px; padding: 0 20px;
  border-radius: 999px;
  font: 800 1.25rem/1 "Tajawal", system-ui, sans-serif;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none;
  transition: transform .15s ease, box-shadow .2s ease;
}
.btn:active { transform: scale(.96); }
.btn:focus-visible { outline: 3px solid var(--a1); outline-offset: 3px; }
.btn-primary {
  color: #fff;
  background: linear-gradient(135deg, var(--a1), var(--a2));
  box-shadow: 0 14px 26px -12px var(--glow);
}
.btn-ghost { color: var(--ghost); background: transparent; box-shadow: inset 0 0 0 2px var(--ghost-line); }

/* final message */
.final .card { padding-top: 40px; padding-bottom: 40px; gap: 24px; }
.final .icon { width: 64px; height: 64px; }
.msg {
  margin: 0;
  font-family: "Amiri", "Noto Naskh Arabic", "Geeza Pro", serif;
  font-size: clamp(1.4rem, 6vw, 1.75rem);
  line-height: 2.1;
  color: var(--ink);
}
.w { display: inline-block; opacity: 0; transform: translateY(10px); }
.final.active .w {
  animation: word .7s ease forwards;
  animation-delay: calc(.6s + var(--i) * 95ms);
}
@keyframes word { to { opacity: 1; transform: none; } }

.sticker {
  display: block; width: min(52vw, 210px); height: auto;
  opacity: 0; transform: scale(.6) rotate(-8deg);
  filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 10px 14px rgba(180, 50, 100, .28));
}
.final.active .sticker { animation: pop .8s cubic-bezier(.2, 1.4, .35, 1) .35s forwards; }
@keyframes pop { to { opacity: 1; transform: none; } }

/* popup */
.modal {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--scrim);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  opacity: 0; visibility: hidden;
  transition: opacity .35s ease, visibility 0s linear .35s;
}
.modal.open { opacity: 1; visibility: visible; transition-delay: 0s; }
.modal .card {
  position: relative; gap: 20px; padding: 40px 24px 32px;
  background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none;
  transform: translateY(24px) scale(.94);
  transition: transform .45s cubic-bezier(.2, 1.2, .3, 1);
}
:root:not([data-theme="dark"]) .modal .card { background: rgba(255, 255, 255, .94); }
.modal.open .card { transform: none; }
.modal .msg { font-size: clamp(1.35rem, 5.6vw, 1.6rem); line-height: 2; }
.close {
  position: absolute; top: 10px; inset-inline-start: 10px;
  width: 48px; height: 48px; border: 0; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  color: var(--ink-soft); background: transparent;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.close:focus-visible { outline: 3px solid var(--a1); }
.close svg { width: 20px; height: 20px; }

@media (max-height: 640px) {
  .card { gap: 20px; padding-top: 24px; }
  .icon { width: 44px; height: 44px; }
}
@media (prefers-reduced-motion: reduce) {
  .screen, .modal, .modal .card { transition-duration: .01s; transition-delay: 0s; }
  .icon { animation: none; }
  .w { opacity: 1; transform: none; }
  .sticker { opacity: 1; transform: none; }
  .final.active .sticker { animation: none; }
  .final.active .w { animation: none; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fab"/>
      <stop offset="1" stop-color="#d4386a"/>
    </linearGradient>
    <symbol id="heart" viewBox="0 0 24 24">

        <button class="btn btn-primary" data-go="q2">نعم</button>
      </div>
    </div>
  </section>

  <section class="screen" id="q2">
    <div class="card">
      <svg class="icon" aria-hidden="true"><use href="#heart"/></svg>
      <h1 class="q">بتقبلي اعتذاري؟</h1>
      <div class="actions two">
        <button class="btn btn-primary" data-go="done">نعم</button>
        <button class="btn btn-ghost" id="no">لا</button>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-describedby="modalMsg">
  <div class="card">
    <button class="close" id="close" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
    <svg class="icon" aria-hidden="true"><use href="#heart"/></svg>
    <p class="msg" id="modalMsg">بتفهمك حنين انو ماتقبلي اعتذاري بس بحاول عشانك</p>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var screens = { q1: $("#q1"), q2: $("#q2"), done: $("#done") };
  var layer = $("#hearts");
  var current = "q1", busy = false;

  /* split the final message into words for a gentle reveal */
  var msg = $("#msg");
  var words = msg.textContent.trim().split(/\s+/);
  msg.textContent = "";
  words.forEach(function (w, i) {
    var s = document.createElement("span");
    s.className = "w";
    s.textContent = w;
    s.style.setProperty("--i", i);
    msg.appendChild(s);
    msg.appendChild(document.createTextNode(" "));
  });

  /* hearts */
  function heart(delay, dur) {
    if (reduce) return;
    var h = document.createElement("span");
    h.className = "heart";
    h.textContent = "\u2665\uFE0E";
    h.style.cssText =
      "--x:" + (Math.random() * 96).toFixed(1) + "%;" +
      "--s:" + (14 + Math.random() * 24).toFixed(0) + "px;" +
      "--d:" + (dur || 8 + Math.random() * 6).toFixed(1) + "s;" +
      "--r:" + ((Math.random() * 80 - 40) | 0) + "deg;" +
      "animation-delay:" + (delay || 0).toFixed(2) + "s";
    h.addEventListener("animationend", function () { h.remove(); });
    layer.appendChild(h);
  }
  for (var i = 0; i < 6; i++) heart(Math.random() * 6);
  setInterval(function () {
    if (!document.hidden && layer.childElementCount < 14) heart();
  }, 1600);
  function burst() { for (var i = 0; i < 24; i++) heart(i * 0.14, 5 + Math.random() * 4); }

  /* transitions */
  function go(name) {
    if (busy || name === current) return;
    busy = true;
    var from = screens[current], to = screens[name];
    from.classList.remove("active");
    from.classList.add("out");
    to.classList.add("active");
    current = name;
    if (name === "done") burst();
    setTimeout(function () {
      from.classList.remove("out");
      busy = false;
      var b = to.querySelector("button");
      if (b) b.focus({ preventScroll: true });
    }, reduce ? 20 : 650);
  }
  document.querySelectorAll("[data-go]").forEach(function (b) {
    b.addEventListener("click", function () { go(b.getAttribute("data-go")); });
  });

  /* popup for "no" */
  var modal = $("#modal"), no = $("#no"), close = $("#close");
  function openModal() { modal.classList.add("open"); close.focus({ preventScroll: true }); }
  function closeModal() { modal.classList.remove("open"); no.focus({ preventScroll: true }); }
  no.addEventListener("click", openModal);
  close.addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
  });
})();
</script>
